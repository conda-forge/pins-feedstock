{% set name = "pins" %}
{% set version = "0.9.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pins-{{ version }}.tar.gz
  sha256: bea7b10304abb5e06327ce1b47de194ff791b50546378057e3b1809bff35235e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - databackend >=0.0.3
    - typing_extensions
    - python >={{ python_min }}
    - fsspec >=2022.2
    - pyyaml >=3.13
    - python-xxhash >=1
    - pandas >=0.23
    - jinja2 >=2.10
    - joblib >=0.12
    - importlib-metadata >=4.4
    - importlib-resources >=1.3
    - appdirs <2
    - humanize >=1
    - requests

test:
  imports:
    - pins
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/rstudio/pins-python
  summary: Publish data sets, models, and other python objects, making it easy to share them across projects and with your colleagues.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gforsyth
